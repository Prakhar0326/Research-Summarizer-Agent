spring.application.name=Research Summarizer Agent
server.port=8080

# OpenAI Configuration (for reference)
openai.api.key=${OPENAI_API_KEY:demo-key}
openai.model=gpt-4-turbo-preview

# HuggingFace Inference API Configuration
# Get your API key from: https://huggingface.co/settings/tokens
huggingface.api.key=${Hugging_Face_API_Key}
#huggingface.model=mistralai/Mistral-7B-Instruct-v0.1
huggingface.model=openai/gpt-oss-120b
huggingface.timeout=30000

# MCP Configuration
mcp.server.url=https://developers.openai.com/mcp
mcp.timeout=30000

# Web Search Configuration
# Using DuckDuckGo - No API key required!
web.search.provider=duckduckgo

tavily.api.key=${TAVILY_API_KEY}

tavily.max-results=5

tavily.timeout=15000

# basic = cheaper/faster
# advanced = deeper/better results
tavily.search-depth=basic

# Logging - ENABLE DEBUG FOR TROUBLESHOOTING
logging.level.root=INFO
logging.level.com.research=DEBUG
logging.level.com.research.summarizer.service=DEBUG
logging.level.com.research.summarizer.agent=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - [%thread] - %-5level - %logger{36} - %msg%n
